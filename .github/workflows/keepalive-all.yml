name: Keep ALL Codespaces Alive

on:
  schedule:
    - cron: '0 */6 * * *' # jalan tiap 6 jam
  workflow_dispatch: # bisa dijalankan manual

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep alive all Codespaces
        run: |
          echo "Ping semua codespaces aktif..."
          curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/user/codespaces \
          | jq -r '.codespaces[].name' \
          | while read cs; do
              echo "Memperbarui $cs..."
              curl -X POST \
                   -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
                   -H "Accept: application/vnd.github+json" \
                   https://api.github.com/user/codespaces/$cs/keep-alive
            done
